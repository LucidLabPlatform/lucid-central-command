name: lucid-central-command

# Full-capabilities umbrella: every Central Command service. Per-service
# definitions live next to each service; this file only wires them together.
# Ollama runs on the GPU by default (set in lucid-ai/compose.yaml).
#
# On a CPU-only dev host, layer the CPU override:
#   docker compose -f compose.yaml -f compose.cpu.yaml up -d
include:
  - lucid-infra/compose.yaml
  - lucid-orchestrator/compose.yaml
  - lucid-ai/compose.yaml
  - lucid-voice/compose.yaml
  - lucid-ui/compose.yaml
