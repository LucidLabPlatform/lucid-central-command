services:
  lucid-voice:
    container_name: lucid-voice
    build: .
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      PIPER_MODEL: ${PIPER_MODEL:-en_US-amy-medium}
      PIPER_MODEL_DIR: /models/piper
      PIPER_LENGTH_SCALE: ${PIPER_LENGTH_SCALE:-1.0}
    volumes:
      - voice_models:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5100/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  voice_models:
    name: lucid-voice-models
